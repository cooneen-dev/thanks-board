<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow" />
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Values in Action</title>



<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

<style>
  /* ------------------------------------------------------------------ theme */

  :root {
    --orange:      #e87722;
    --orange-deep: #cc6413;
    --orange-soft: #fdf0e3;

    --ink:       #231f1d;
    --ink-2:     #4b453f;
    --ink-soft:  #7c756d;
    --ink-faint: #aaa39b;

    --page:      #e9e2d8;
    --bar:       #231f1d;
    --bar-ink:   #ffffff;
    --panel:     #fdfbf7;
    --card:      #ffffff;
    --line:      #e7e0d6;
    --line-soft: #f2ece3;
    --track:     #ece5db;

    --shadow:    0 1px 3px rgba(35,31,29,.07);
    --shadow-lg: 0 10px 28px rgba(35,31,29,.10);
    --radius:    0.85rem;
  }

  html[data-theme="dark"] {
    --orange:      #ff9142;
    --orange-deep: #e87722;
    --orange-soft: #2a1e13;

    --ink:       #f4f0ea;
    --ink-2:     #cdc6bd;
    --ink-soft:  #9c948b;
    --ink-faint: #6d665f;

    --page:      #100e0c;
    --bar:       #000000;
    --bar-ink:   #f4f0ea;
    --panel:     #1c1916;
    --card:      #221e1a;
    --line:      #332c25;
    --line-soft: #2a241e;
    --track:     #2c261f;

    --shadow:    0 1px 3px rgba(0,0,0,.45);
    --shadow-lg: 0 10px 30px rgba(0,0,0,.55);
  }

  /* One knob scales the whole board. A 1366 laptop lands near 18px, a 1080p
     screen near 23px, a 4K panel hits the ceiling. */
  html { font-size: clamp(15px, 1.05vw + 5px, 32px); }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--page);
    color: var(--ink);
    font-family: 'Nunito', system-ui, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    cursor: none;              /* nothing here is clickable on a wall screen */
  }

  h1, h2, h3, p { margin: 0; }

  .screen {
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    padding: 0.7rem 0.8rem 0.55rem;
  }

  /* ------------------------------------------------------------------- bar */

  .top {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.5rem 1.1rem;
    border-radius: var(--radius);
    background: var(--bar);
    color: var(--bar-ink);
  }

  .brand { display: flex; align-items: center; gap: 0.6rem; }

  .brand svg { width: 2.5rem; height: 1.3rem; display: block; }
  .brand .wm { line-height: 1; }
  .brand .wm b {
    display: block;
    font-size: 1.15rem;
    font-weight: 900;
    letter-spacing: 0.02em;
  }
  .brand .wm span {
    display: block;
    font-size: 0.58rem;
    font-weight: 800;
    letter-spacing: 0.42em;
    color: var(--orange);
  }

  .topright { text-align: right; line-height: 1.15; }
  .topright .ttl {
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .topright .tsub {
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--orange);
    max-width: 34rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ----------------------------------------------------------- recognition */

  .recog {
    flex: 1 1 57%;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    padding: 0.85rem 1rem 1rem;
    background: var(--panel);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .sechead {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
  }
  .sechead h2 {
    font-size: 1.4rem;
    font-weight: 900;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .sechead h2 em { font-style: normal; color: var(--orange); }
  .sechead .lead {
    flex: 1;
    min-width: 0;
    font-size: 0.82rem;
    color: var(--ink-soft);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sechead .now {
    flex: 0 0 auto;
    font-size: 0.82rem;
    font-weight: 800;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    margin-left: 0.7rem;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .live i { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: currentColor; }
  .live.stale { color: #b8730b; background: rgba(242,169,0,.14); }
  .live.down  { color: #c2255c; background: rgba(194,37,92,.12); }
  .live[hidden] { display: none; }

  .recogbody {
    flex: 1;
    min-height: 0;
    display: flex;
    gap: 0.7rem;
  }

  .cards {
    flex: 1;
    min-width: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
  }

  .slot { min-width: 0; display: flex; }
  .slot--empty { visibility: hidden; }

  /* ----------------------------------------------------------------- cards */

  .card {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--c);
    border-radius: 0.7rem;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .chead {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.7rem 0.9rem;
    background: color-mix(in srgb, var(--c) 9%, transparent);
    border-bottom: 1px solid var(--line-soft);
  }
  .cav {
    flex: 0 0 auto;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--c);
  }
  .cav svg { width: 1.4rem; height: 1.4rem; fill: #fff; }
  .cnames { min-width: 0; }
  .cbadge {
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--c);
  }
  .crecip {
    font-size: 1.5rem;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -0.01em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .cmsg {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    padding: 0.9rem 1rem;
    font-size: 1.3rem;
    font-weight: 600;
    line-height: 1.35;
    color: var(--ink-2);
    overflow: hidden;
  }
  .cmsg span {
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cmsg--md { font-size: 1.12rem; }
  .cmsg--sm { font-size: 0.98rem; -webkit-line-clamp: 6; }

  .cfoot {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.6rem;
    padding: 0.55rem 0.9rem 0.7rem;
    border-top: 1px solid var(--line-soft);
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .cfoot b { color: var(--ink); font-weight: 800; }
  .cfoot .cdate { flex: 0 0 auto; font-weight: 700; color: var(--ink-faint); }

  /* Two cards changing in step would read as the page reloading, so each gets
     its own timer and its own way in. */
  @keyframes riseIn { from { opacity: 0; transform: translateY(0.7rem); } to { opacity: 1; transform: none; } }
  @keyframes slideIn { from { opacity: 0; transform: translateX(0.9rem); } to { opacity: 1; transform: none; } }

  #slot0 .card.in { animation: riseIn 0.55s cubic-bezier(.22,.8,.3,1) both; }
  #slot1 .card.in { animation: slideIn 0.55s cubic-bezier(.22,.8,.3,1) both; }

  /* ------------------------------------------------------------ stats rail */

  .stats {
    flex: 0 0 14.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    padding-left: 0.85rem;
    border-left: 1px solid var(--line);
  }

  .skicker {
    font-size: 0.65rem;
    font-weight: 900;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .sbig { display: flex; align-items: baseline; gap: 0.4rem; }
  .sbig b {
    font-size: 2.9rem;
    font-weight: 900;
    line-height: 0.9;
    color: var(--orange);
    font-variant-numeric: tabular-nums;
  }
  .sbig span { font-size: 0.95rem; font-weight: 800; }
  .ssub { font-size: 0.76rem; color: var(--ink-soft); }

  .sbars { display: flex; flex-direction: column; gap: 0.28rem; }
  .sbar {
    display: grid;
    grid-template-columns: 1.05rem 1fr auto;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.76rem;
    font-weight: 700;
  }
  .sbar svg { width: 1.05rem; height: 1.05rem; fill: var(--c); }
  .sbar .sn { color: var(--ink-2); }
  .sbar .sc {
    font-weight: 900;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .sbar--zero { opacity: 0.45; }
  .strk {
    grid-column: 2 / 4;
    height: 0.3rem;
    border-radius: 999px;
    background: var(--track);
    overflow: hidden;
  }
  .strk i { display: block; height: 100%; border-radius: 999px; background: var(--c); }

  .spair { display: flex; flex-direction: column; gap: 0.5rem; }
  .sname {
    font-size: 1rem;
    font-weight: 900;
    line-height: 1.15;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sname small { font-weight: 700; color: var(--ink-faint); }

  .supd { margin-top: auto; font-size: 0.68rem; color: var(--ink-faint); }

  /* ------------------------------------------------------------ value band */

  .band {
    flex: 1 1 43%;
    min-height: 0;
    display: flex;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .band[hidden] { display: none; }

  .vmain {
    flex: 1 1 58%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.2rem 1.6rem;
    background: var(--panel);
  }

  .kicker {
    font-size: 0.68rem;
    font-weight: 900;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--orange);
  }

  .vmain-text {
    font-size: 2.5rem;
    font-weight: 900;
    line-height: 1.14;
    letter-spacing: -0.02em;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .vmain-text--md { font-size: 1.85rem; -webkit-line-clamp: 5; }
  .vmain-text--sm { font-size: 1.35rem; font-weight: 800; line-height: 1.3; -webkit-line-clamp: 6; }

  .vflip {
    flex: 1 1 42%;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 1.2rem 1.5rem;
    background: var(--orange);
    color: #fff;
  }
  .vflip[hidden] { display: none; }
  .vflip .kicker { color: rgba(255,255,255,.72); }

  .vstage {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.5rem;
  }
  .vstage.in { animation: riseIn 0.5s cubic-bezier(.22,.8,.3,1) both; }

  .vnum {
    font-size: 0.85rem;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,.62);
  }
  .vtext {
    font-size: 1.5rem;
    font-weight: 800;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 6;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .vtext--md { font-size: 1.2rem; }
  .vtext--sm { font-size: 0.98rem; font-weight: 700; -webkit-line-clamp: 8; }

  .dots { flex: 0 0 auto; display: flex; gap: 0.3rem; }
  .dots i {
    width: 1.1rem;
    height: 0.22rem;
    border-radius: 999px;
    background: rgba(255,255,255,.32);
    transition: background 0.3s;
  }
  .dots i.on { background: #fff; }

  /* ---------------------------------------------------------------- footer */

  .foot {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0.35rem;
    font-size: 0.66rem;
    font-weight: 800;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .foot .ask { color: var(--orange); }

  /* -------------------------------------------------------------- overlays */

  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    text-align: center;
    background: var(--page);
    z-index: 10;
    padding: 2rem;
  }
  .overlay[hidden], .gate[hidden] { display: none; }
  .overlay .mark, .gate .mark { font-size: 3rem; line-height: 1; }
  .overlay .big, .gate .big { font-size: 1.5rem; font-weight: 900; }
  .overlay .small, .gate .small { font-size: 0.9rem; color: var(--ink-soft); max-width: 28rem; }

  /* The key screen. Only ever seen on a published copy, where the data files
     beside this page are sealed and nothing can be drawn until one is opened.
     It sits above the offline overlay: a board waiting for a key is not a
     board with a network problem, and only one of the two is worth reading. */
  .gate {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.9rem;
    text-align: center;
    background: var(--page);
    z-index: 20;
    padding: 2rem;
    cursor: auto;
  }
  .gate form { display: flex; gap: 0.5rem; margin-top: 0.2rem; }
  .gate input {
    width: 20rem;
    max-width: 60vw;
    padding: 0.6rem 0.8rem;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 0.6rem;
    outline: none;
  }
  .gate input:focus { border-color: var(--orange); }
  .gate button {
    padding: 0.6rem 1.2rem;
    font: inherit;
    font-size: 1rem;
    font-weight: 900;
    color: #fff;
    background: var(--orange);
    border: 0;
    border-radius: 0.6rem;
    cursor: pointer;
  }
  .gate .err {
    font-size: 0.9rem;
    font-weight: 800;
    color: #c2255c;
    min-height: 1.2rem;
    max-width: 26rem;
  }

  /* A screen narrow enough that two cards side by side would each be a column
     of single words. One card, and the rail underneath it. */
  @media (max-aspect-ratio: 1/1) {
    .recogbody { flex-direction: column; }
    .cards { grid-template-columns: 1fr; }
    #slot1 { display: none; }
    .stats {
      flex: 0 0 auto;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 0.7rem 0 0;
      border-left: 0;
      border-top: 1px solid var(--line);
    }
    .band { flex-direction: column; }
  }
</style>
</head>

<body>

<div class="screen">

  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 60 30" aria-hidden="true">
        <g fill="none" stroke="#e87722" stroke-width="5">
          <circle cx="17" cy="15" r="11" />
          <circle cx="40" cy="15" r="11" />
        </g>
      </svg>
      <div class="wm"><b>COONEEN</b><span>GROUP</span></div>
    </div>
    <div class="topright">
      <div class="ttl">Values in Action</div>
      <div class="tsub" id="edition"></div>
    </div>
  </header>

  <section class="recog">
    <div class="sechead">
      <h2>Colleague <em>Recognition</em></h2>
      <span class="lead" id="lead">Recent thanks from across the group</span>
      <span class="now" id="clock"></span>
      <span class="live" id="live" hidden><i></i><span id="livetext"></span></span>
    </div>

    <div class="recogbody">
      <div class="cards">
        <div class="slot slot--empty" id="slot0"></div>
        <div class="slot slot--empty" id="slot1"></div>
      </div>
      <aside class="stats" id="stats"></aside>
    </div>
  </section>

  
  <section class="band" id="band" hidden>
    <div class="vmain">
      <div class="kicker" id="vmain-kicker">Our value of the month</div>
      <div class="vmain-text" id="vmain-text"></div>
    </div>
    <div class="vflip" id="vflip" hidden>
      <div class="kicker">In practice</div>
      <div class="vstage" id="vstage">
        <div class="vnum" id="vnum"></div>
        <div class="vtext" id="vtext"></div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </section>

  <footer class="foot">
    <span>Cooneen Group &middot; Internal Communications</span>
    <span class="ask">Have you thanked a colleague today?</span>
  </footer>

</div>

<div class="overlay" id="overlay" hidden>
  <div class="mark" id="ov-mark">&#9888;</div>
  <div class="big" id="ov-big"></div>
  <div class="small" id="ov-small"></div>
</div>

<div class="gate" id="gate" hidden>
  <div class="mark">&#128274;</div>
  <div class="big">Values in Action</div>
  <div class="small">This board is sealed. Enter the key to open it on this screen.</div>
  <form id="gate-form" autocomplete="off">
    <input id="gate-key" type="password" placeholder="Key" aria-label="Key"
           autocomplete="off" spellcheck="false" />
    <button type="submit">Open</button>
  </form>
  <div class="err" id="gate-err"></div>
</div>

<script>
(function () {
  "use strict";

  // ------------------------------------------------------------------ config

  var q = new URLSearchParams(location.search);

  var API      = q.get("api")  || "thanks.json";
  var NEWS_API = q.get("news") || "newsletter.json";
  var REFRESH  = Math.max(0, parseInt(q.get("refresh") || "60", 10) || 0);

  // Seconds a thanks card is held. Each of the two runs on this, half a cycle
  // apart, so something changes every SPEED seconds but never both at once.
  var SPEED  = Math.max(3, parseFloat(q.get("speed")  || "9")  || 9);
  var VSPEED = Math.max(4, parseFloat(q.get("vspeed") || "11") || 11);

  // Everything is sized in rem against a viewport-scaled root, so one
  // multiplier moves the whole board at once. Tune it from the screen's own
  // URL rather than editing the file: ?scale=1.2 for a set further away. The
  // base is recomputed rather than read back, so a resize does not compound
  // what was already applied.
  var SCALE = Math.min(3, Math.max(0.5, parseFloat(q.get("scale") || "1") || 1));

  function applyScale() {
    if (SCALE === 1) return;
    var base = Math.min(32, Math.max(15, 0.0105 * window.innerWidth + 5));
    document.documentElement.style.fontSize = (base * SCALE).toFixed(2) + "px";
  }
  applyScale();

  if (q.get("theme") === "dark") document.documentElement.dataset.theme = "dark";

  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------- sealed data
  //
  // A published copy of this page sits beside two json files it cannot read.
  // The publisher seals them with AES-GCM before committing, so the repository
  // can be public while the board is not. The key opens them here, in the
  // browser, and is never sent anywhere.
  //
  //     ?key=...     what an unattended screen is pointed at
  //     typed once   kept in this browser afterwards, so a reload is silent
  //
  // Whether a file is sealed is decided by what came back, never by
  // configuration. A plain json answer is passed through untouched, which is
  // the case on the wall inside: that screen talks to the portal directly,
  // sees none of this, and is never asked for anything.

  var KEY_STORE = "thanks-wall-key";

  function storedKey() {
    try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; }
  }

  function rememberKey(key) {
    // A screen in kiosk mode with storage disabled still works for as long as
    // it stays open, and one driven by ?key= never needs this at all.
    try { localStorage.setItem(KEY_STORE, key); } catch (e) {}
  }

  var KEY = q.get("key") || storedKey();

  // A key in the URL is what this screen was deliberately sent with, so it
  // beats anything the browser happened to be holding, and replaces it.
  if (q.get("key")) rememberKey(KEY);

  function isSealed(d) {
    return !!(d && d.alg === "AES-GCM" && d.ct && d.salt && d.nonce);
  }

  function b64bytes(text) {
    var bin = atob(text), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  // Deriving the key is slow on purpose, that being the entire point of it, so
  // it happens once and is kept rather than on every poll. The wrapper carries
  // the salt and the iteration count, so if the publisher ever changes either
  // this follows along without an edit here.
  var derived = null;

  function deriveKey(wrapper) {
    var subtle = window.crypto && window.crypto.subtle;
    if (!subtle) {
      // Only available over https or on localhost. Worth saying plainly,
      // because from the screen it otherwise looks like a rejected key.
      var e = new Error("This page must be opened over https to unseal the board.");
      e.fatal = true;
      return Promise.reject(e);
    }

    var tag = wrapper.salt + "|" + wrapper.iter + "|" + KEY;
    if (derived && derived.tag === tag) return derived.promise;

    var promise = subtle
      .importKey("raw", new TextEncoder().encode(KEY), "PBKDF2", false, ["deriveKey"])
      .then(function (material) {
        return subtle.deriveKey({
          name:       "PBKDF2",
          salt:       b64bytes(wrapper.salt),
          iterations: wrapper.iter || 310000,
          hash:       "SHA-256"
        }, material, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      });

    derived = { tag: tag, promise: promise };
    return promise;
  }

  function unseal(wrapper) {
    return deriveKey(wrapper).then(function (key) {
      return window.crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64bytes(wrapper.nonce) }, key, b64bytes(wrapper.ct));
    }).then(function (plain) {
      return JSON.parse(new TextDecoder().decode(plain));
    });
  }

  // Every read of a data file goes through here, so one file being sealed and
  // the other not is a case nothing has to be told about.
  function fetchJSON(url) {
    return fetch(url, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (d) {
        if (!isSealed(d)) return d;
        if (!KEY) { gate(true, ""); throw new Error("no key"); }

        return unseal(d).then(function (opened) {
          gate(false);
          return opened;
        }, function (e) {
          // A refused key is not a network fault and polling will not mend it.
          // Ask for one and let the polls keep failing quietly behind the gate.
          gate(true, e && e.fatal ? e.message : "That key does not open this board.");
          throw e;
        });
      });
  }

  function gate(show, message) {
    var el = $("gate");
    if (!show) { el.hidden = true; return; }

    $("gate-err").textContent = message || "";
    if (el.hidden) {
      el.hidden = false;
      $("gate-key").value = "";
      $("gate-key").focus();
    }
  }

  $("gate-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var typed = $("gate-key").value.trim();
    if (!typed) return;

    KEY = typed;
    derived = null;
    rememberKey(KEY);
    $("gate-err").textContent = "Opening...";

    // The polls are what actually test a key. A good one takes the gate down
    // from inside fetchJSON, a bad one puts the message back.
    load();
    loadNews();
  });

  // ------------------------------------------------------------------ badges

  var BADGE_COLORS = {
    Teamwork:   "#e87722",
    Results:    "#2f9e44",
    Ownership:  "#1971c2",
    Positivity: "#f2a900",
    Wellbeing:  "#c2255c",
    Trust:      "#7048e8"
  };
  var BADGE_FALLBACK = "#6b7280";

  var BADGE_ICONS = {
    Teamwork:   "M16 11c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 3-1.34 3-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z",
    Results:    "M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4-6.2-4.6-6.2 4.6 2.4-7.4L2 9.4h7.6z",
    Ownership:  "M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-1.2 15.2L7 12.4l1.4-1.4 2.4 2.4 5.2-5.2L17.4 9l-6.6 7.2z",
    Positivity: "M12 2a10 10 0 100 20 10 10 0 000-20zM8.5 9a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zm4 0a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zM12 18c-2.6 0-4.8-1.7-5.6-4h11.2c-.8 2.3-3 4-5.6 4z",
    Wellbeing:  "M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z",
    Trust:      "M11 2.5L4 6v5.5c0 4.6 3 8.8 7 10 4-1.2 7-5.4 7-10V6l-7-3.5zm5 9a5 5 0 01-10 0V7.2l5-2.5 5 2.5v4.3z"
  };

  // The company values, in the order the portal lists them. This is the rail's
  // running order too, so a value keeps its place whether it was handed out
  // fifty times this fortnight or not at all.
  var VALUES = ["Teamwork", "Results", "Ownership", "Positivity", "Wellbeing", "Trust"];

  var ICON_FALLBACK = BADGE_ICONS.Results;

  function color(badge) { return BADGE_COLORS[badge] || BADGE_FALLBACK; }
  function icon(badge)  { return BADGE_ICONS[badge]  || ICON_FALLBACK; }

  // ------------------------------------------------------------------- utils

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // The backend stamps UTC but the ISO string can arrive without a zone marker.
  // Left alone the browser reads a bare stamp as local time, shifting every
  // date by the current offset.
  function toDate(iso) {
    if (!iso) return null;
    var s = String(iso);
    if (!/[zZ]|[+-]\d\d:?\d\d$/.test(s)) s += "Z";
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }

  function ago(iso) {
    var d = toDate(iso);
    if (!d) return "";
    var mins = Math.round((Date.now() - d.getTime()) / 60000);
    if (mins < 1)  return "just now";
    if (mins < 60) return mins + " min ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24)  return hrs === 1 ? "an hour ago" : hrs + " hours ago";
    var days = Math.round(hrs / 24);
    if (days === 1) return "yesterday";
    if (days < 7)   return days + " days ago";
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  // Restarts a CSS animation that is already on the element.
  function replay(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function sizeClass(text, base, mid, small) {
    var n = String(text || "").length;
    if (n <= mid)   return "";
    if (n <= small) return base + "--md";
    return base + "--sm";
  }

  // ------------------------------------------------------------- stats rail

  function bar(name, count, max) {
    return '<div class="sbar' + (count ? "" : " sbar--zero") + '" style="--c:' + color(name) + '">' +
             '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + icon(name) + '"/></svg>' +
             '<span class="sn">' + esc(name) + "</span>" +
             '<span class="sc">' + count + "</span>" +
             '<span class="strk"><i style="width:' + Math.round((count / max) * 100) + '%"></i></span>' +
           "</div>";
  }

  // The endpoint only reports badges that were actually given, so on a quiet
  // fortnight a value would silently disappear off a board whose whole job is
  // to show the values. Merge the known six against what came back, keep the
  // zeros, and append anything new so a seventh value appears here on its own.
  function renderStats(d) {
    var counts = {}, names = VALUES.slice();
    (d.badges || []).forEach(function (b) {
      counts[b.badge] = b.count;
      if (names.indexOf(b.badge) === -1) names.push(b.badge);
    });

    var max = 1;
    names.forEach(function (n) { max = Math.max(max, counts[n] || 0); });

    var top   = (d.recipients && d.recipients[0]) || null;
    var giver = (d.givers && d.givers[0]) || null;

    $("stats").innerHTML =
      '<div class="skicker">' +
        (d.window_days ? "Last " + d.window_days + " days" : "Recently") + "</div>" +
      '<div class="sbig"><b>' + esc(d.count) + "</b><span>thank yous</span></div>" +
      '<div class="ssub">' + esc(d.people_thanked) + " colleagues thanked by " +
        esc(d.people_giving) + "</div>" +
      '<div class="sbars">' + names.map(function (n) {
        return bar(n, counts[n] || 0, max);
      }).join("") + "</div>" +
      '<div class="spair">' +
        (top ? '<div><div class="skicker">Most thanked</div>' +
               '<div class="sname">' + esc(top.name) +
               ' <small>&times;' + esc(top.count) + "</small></div></div>" : "") +
        (giver ? '<div><div class="skicker">Most thanks given</div>' +
                 '<div class="sname">' + esc(giver.name) +
                 ' <small>&times;' + esc(giver.count) + "</small></div></div>" : "") +
      "</div>" +
      '<div class="supd">' + (d.fetched_at ? "Updated " + esc(ago(d.fetched_at)) : "") + "</div>";
  }

  // ------------------------------------------------------------------- cards

  function cardHTML(t) {
    var c    = color(t.badge);
    var when = t.date_iso ? ago(t.date_iso) : (t.date || "");
    var msg  = t.message || "";

    return '<div class="card" style="--c:' + c + '">' +
             '<div class="chead">' +
               '<div class="cav"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="' +
                 icon(t.badge) + '"/></svg></div>' +
               '<div class="cnames">' +
                 '<div class="cbadge">' + esc(t.badge || "Thanks") + "</div>" +
                 '<div class="crecip">' + esc(t.recipient) + "</div>" +
               "</div>" +
             "</div>" +
             '<div class="cmsg ' + sizeClass(msg, "cmsg", 95, 200) + '"><span>' +
               esc(msg) + "</span></div>" +
             '<div class="cfoot">' +
               "<span>" + (t.giver ? "from <b>" + esc(t.giver) + "</b>" : "") + "</span>" +
               '<span class="cdate">' + esc(when) + "</span>" +
             "</div>" +
           "</div>";
  }

  // Two slots drawing from one list, so the same thanks is never up twice, and
  // two timers half a cycle apart, so they never turn over together.
  var items = [], cursor = 0, timers = [], itemSig = "";

  function stopRotation() {
    timers.forEach(clearTimeout);
    timers.forEach(clearInterval);
    timers = [];
  }

  function fillSlot(idx) {
    var el = $("slot" + idx);
    if (!items.length) { el.innerHTML = ""; el.classList.add("slot--empty"); return; }

    el.classList.remove("slot--empty");
    el.innerHTML = cardHTML(items[cursor % items.length]);
    cursor++;
    replay(el.firstElementChild, "in");
  }

  function renderWall(list) {
    var sig = list.map(function (t) {
      return [t.recipient, t.giver, t.badge, t.message, t.date_iso || t.date].join("|");
    }).join("~");

    // A poll that brings back the same thanks must not send both slots back to
    // the top of the list every minute.
    if (sig === itemSig) return;
    itemSig = sig;
    items   = list;
    cursor  = 0;

    stopRotation();
    fillSlot(0);
    fillSlot(1);
    if (items.length <= 2) return;

    timers.push(setInterval(function () { fillSlot(0); }, SPEED * 2000));
    timers.push(setTimeout(function () {
      fillSlot(1);
      timers.push(setInterval(function () { fillSlot(1); }, SPEED * 2000));
    }, SPEED * 1000));
  }

  // ------------------------------------------------------------------ values
  //
  // The main value is held for as long as the issue stands. The rest take
  // turns beside it, one at a time.

  var rest = [], vIdx = 0, vTimer = null, valueSig = "";

  function showValue(i) {
    var v = rest[i];
    if (!v) return;

    $("vnum").textContent  = "0" + (v.n || i + 1);
    var text = $("vtext");
    text.textContent = v.text || "";
    text.className   = "vtext " + sizeClass(v.text, "vtext", 110, 240);

    var dots = $("dots").children;
    for (var k = 0; k < dots.length; k++) dots[k].classList.toggle("on", k === i);

    replay($("vstage"), "in");
  }

  function renderValues(n) {
    var all  = (n && n.values) || [];
    var main = null;
    var others = [];

    all.forEach(function (v) {
      if (v.main && !main) main = v;
      else others.push(v);
    });

    // An issue published before values existed, or one whose author marked
    // none, still has something worth putting up.
    if (!main && n) main = { text: n.summary || n.title || "" };
    if (!main || !main.text) {
      $("band").hidden = true;
      valueSig = "";
      if (vTimer) { clearInterval(vTimer); vTimer = null; }
      return;
    }

    var sig = (n.id || "") + "|" + all.map(function (v) { return v.n + ":" + v.text; }).join("~");
    if (sig === valueSig) return;
    valueSig = sig;

    $("band").hidden = false;
    $("vmain-kicker").textContent = n.edition ? "Our value of the month" : "Our values";
    var mt = $("vmain-text");
    mt.textContent = main.text;
    mt.className   = "vmain-text " + sizeClass(main.text, "vmain-text", 70, 190);

    rest = others;
    if (vTimer) { clearInterval(vTimer); vTimer = null; }

    if (!rest.length) { $("vflip").hidden = true; return; }

    $("vflip").hidden = false;
    $("dots").innerHTML = rest.map(function () { return "<i></i>"; }).join("");

    vIdx = 0;
    showValue(0);
    if (rest.length > 1) {
      vTimer = setInterval(function () {
        vIdx = (vIdx + 1) % rest.length;
        showValue(vIdx);
      }, VSPEED * 1000);
    }
  }

  // ------------------------------------------------------------------ states

  function overlay(mark, big, small) {
    if (!big) { $("overlay").hidden = true; return; }
    $("ov-mark").innerHTML  = mark;
    $("ov-big").textContent = big;
    $("ov-small").textContent = small || "";
    $("overlay").hidden = false;
  }

  // Healthy is silent. The pill only appears for a problem.
  function live(cls, text) {
    var pill = $("live");
    if (!cls) { pill.hidden = true; return; }
    pill.className = "live " + cls;
    $("livetext").textContent = text;
    pill.hidden = false;
  }

  var REASONS = {
    "no-file":    "The thanks file has not been written yet.",
    "unreadable": "The thanks file could not be read.",
    "empty":      "There are no thanks in the current window.",
    "error":      "The list of thanks could not be built."
  };

  // -------------------------------------------------------------------- poll

  function load() {
    // The endpoint sends a 60 second public Cache-Control, which is right for
    // the network but would otherwise hand a refresh the same bytes back.
    var url = API + (API.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();

    fetchJSON(url)
      .then(function (d) {
        if (!d || d.available === false) {
          overlay("&#9749;", "No thanks to show yet",
                  REASONS[(d && d.reason) || ""] || "Nothing is available right now.");
          live("stale", "Waiting for data");
          return;
        }

        overlay(null);
        live("");
        renderStats(d);
        renderWall(d.thanks || []);
      })
      .catch(function () {
        // A dropped poll is not worth blanking a wall screen over. Keep the
        // last good board up and mark it, and only take over the screen if
        // there was never anything there to begin with.
        live("down", "Reconnecting");
        if (!$("stats").children.length) {
          overlay("&#128246;", "Board is offline",
                  "Waiting for an answer. This screen will come back on its own.");
        }
      });
  }

  function loadNews() {
    var url = NEWS_API + (NEWS_API.indexOf("?") === -1 ? "?" : "&") + "_=" + Date.now();

    fetchJSON(url)
      .then(function (d) {
        var n = (d && d.available && d.current) ? d.current : null;
        $("edition").textContent = n ? [n.title, n.edition].filter(Boolean).join("  ·  ") : "";
        renderValues(n);
      })
      .catch(function () {
        // A dropped poll leaves whatever is already up there.
      });
  }

  // ------------------------------------------------------------------- clock

  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString(undefined, {
      hour: "2-digit", minute: "2-digit"
    });
  }
  tick();
  setInterval(tick, 15000);

  // -------------------------------------------------------------------- boot

  load();
  loadNews();
  if (REFRESH) {
    setInterval(load, REFRESH * 1000);
    // An issue is published every few weeks, so there is nothing to gain from
    // asking as often as the thanks. Every tenth poll, and never under 5 min.
    setInterval(loadNews, Math.max(300, REFRESH * 10) * 1000);
  }

  // A resize changes the rem scale. Nothing here is measured in JS, so the
  // layout follows on its own once the root has moved.
  var resizing;
  window.addEventListener("resize", function () {
    clearTimeout(resizing);
    resizing = setTimeout(applyScale, 300);
  });

  // Nothing on a wall screen should sleep, but a browser tab that has been
  // backgrounded comes back stale. Catch up on the way in.
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) { load(); loadNews(); }
  });
})();
</script>

</body>
</html>
